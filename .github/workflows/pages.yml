name: Sync website to XEKernel.github.io

on:
  push:
    branches: [main]
    paths:
      - 'Web/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to XEKernel.github.io/projects/handwrite/
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: XEKernel/XEKernel.github.io
          publish_dir: Web
          destination_dir: projects/handwrite
          publish_branch: main
          keep_files: true
